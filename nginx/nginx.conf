events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:4000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Avatar uploads cap at 5 MB; allow a small buffer over
        client_max_body_size 6m;

        # All API traffic — REST, static file serving, and SSE streaming
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Clear Connection header so HTTP/1.1 keep-alive works end-to-end.
            # Required for SSE — nginx must not send "Connection: close" upstream.
            proxy_set_header Connection '';

            # Disable response buffering so SSE events flush immediately to the browser.
            proxy_buffering  off;
            proxy_cache      off;

            # SSE connections are long-lived; default 60 s would cut them prematurely.
            proxy_read_timeout 3600s;
        }

        # All other traffic goes to the Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
